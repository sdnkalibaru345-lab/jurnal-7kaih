    <main><header class="topbar"><div><h1 id="pageTitle">Data Siswa</h1><p>Kelola akun siswa Jurnal 7 KAIH</p></div><span class="prototype">PROTOTIPE LOKAL</span></header><div class="content"><section class="stats"><div class="stat"><small>Total siswa</small><strong id="studentCount">0</strong></div><div class="stat"><small>Kelas aktif</small><strong id="classCount">0</strong></div><div class="stat"><small>Akun aktif</small><strong id="activeCount">0</strong></div></section><section id="panel" class="panel"></section></div></main>
  </div>
  <nav class="mobile-nav"><button data-view="students" class="active" onclick="setView('students')">👥 Siswa</button><button data-view="classes" onclick="setView('classes')">🏫 Kelas</button></nav>
  <div id="backdrop" class="backdrop hidden" onclick="if(event.target===this)closeDialog()"><div id="dialog" class="dialog"></div></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const seedClasses=Array.from({length:6},(_,grade)=>Array.from({length:4},(_,room)=>({id:'c'+(grade+1)+String.fromCharCode(65+room),name:String(grade+1)+String.fromCharCode(65+room),active:true}))).flat();
    const seedStudents=[];
    let classes=JSON.parse(localStorage.getItem('j7-admin-v2-classes')||'null')||seedClasses,students=JSON.parse(localStorage.getItem('j7-admin-v2-students')||'null')||seedStudents,view='students',query='',classFilter='',statusFilter='';
    const panel=document.getElementById('panel'),dialog=document.getElementById('dialog'),backdrop=document.getElementById('backdrop'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){localStorage.setItem('j7-admin-v2-classes',JSON.stringify(classes));localStorage.setItem('j7-admin-v2-students',JSON.stringify(students))}
    function klass(id){return classes.find(c=>c.id===id)?.name||'Tanpa kelas'}
    function stats(){studentCount.textContent=students.length;classCount.textContent=classes.filter(c=>c.active).length;activeCount.textContent=students.filter(s=>s.active).length}
    function setView(next){view=next;query='';classFilter='';statusFilter='';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));pageTitle.textContent=view==='students'?'Data Siswa':'Data Kelas';render()}
    function render(){stats();view==='students'?renderStudents():renderClasses()}
    function header(title,desc,button){const filters=view==='students'?'<select class="filter" onchange="classFilter=this.value;render()"><option value="">Semua kelas</option>'+classes.map(c=>'<option value="'+c.id+'" '+(classFilter===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><select class="filter" onchange="statusFilter=this.value;render()"><option value="">Semua status</option><option value="active" '+(statusFilter==='active'?'selected':'')+'>Aktif</option><option value="inactive" '+(statusFilter==='inactive'?'selected':'')+'>Nonaktif</option></select>':'';return '<div class="panel-head"><div><h2>'+title+'</h2><p>'+desc+'</p></div><div class="tools"><input class="search" value="'+esc(query)+'" oninput="query=this.value;render()" placeholder="Cari '+(view==='students'?'nama atau kelas':'kelas')+'">'+filters+(view==='students'?'<button class="btn" onclick="openImport()">⇧ Import & Timpa</button>':'')+'<button class="btn primary" onclick="'+button+'">＋ Tambah</button></div></div>'}
    function renderStudents(){const rows=students.filter(s=>(s.name+' '+klass(s.classId)).toLowerCase().includes(query.toLowerCase())&&(!classFilter||s.classId===classFilter)&&(!statusFilter||(statusFilter==='active'?s.active:!s.active)));panel.innerHTML=header('Daftar Siswa','Tambah dan perbarui akun siswa.','openStudent()')+(rows.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Nama siswa</th><th>Kelas</th><th>PIN</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+rows.map(s=>'<tr><td><span class="name">'+esc(s.name)+'</span></td><td>'+esc(klass(s.classId))+'</td><td>••••'+esc(s.pin.slice(-2))+'</td><td>'+badge(s.active)+'</td><td>'+actions('Student',s.id)+'</td></tr>').join('')+'</tbody></table></div><div class="cards-mobile">'+rows.map(s=>'<article class="record"><div class="record-top"><div><h3>'+esc(s.name)+'</h3><p>Kelas '+esc(klass(s.classId))+'</p></div>'+badge(s.active)+'</div><div class="record-foot"><small>PIN ••••'+esc(s.pin.slice(-2))+'</small>'+actions('Student',s.id)+'</div></article>').join('')+'</div>':'<div class="empty">Belum ada siswa yang cocok.</div>')}
    function renderClasses(){const rows=classes.filter(c=>c.name.toLowerCase().includes(query.toLowerCase()));panel.innerHTML=header('Daftar Kelas','Kelola kelas yang tersedia pada jurnal.','openClass()')+(rows.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Kelas</th><th>Jumlah siswa</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+rows.map(c=>'<tr><td class="name">Kelas '+esc(c.name)+'</td><td>'+students.filter(s=>s.classId===c.id).length+'</td><td>'+badge(c.active)+'</td><td>'+actions('Class',c.id)+'</td></tr>').join('')+'</tbody></table></div><div class="cards-mobile">'+rows.map(c=>'<article class="record"><div class="record-top"><div><h3>Kelas '+esc(c.name)+'</h3><p>'+students.filter(s=>s.classId===c.id).length+' siswa</p></div>'+badge(c.active)+'</div><div class="record-foot"><span></span>'+actions('Class',c.id)+'</div></article>').join('')+'</div>':'<div class="empty">Belum ada kelas yang cocok.</div>')}
    function badge(on){return '<span class="badge '+(on?'on':'off')+'">'+(on?'● Aktif':'● Nonaktif')+'</span>'}function actions(type,id){return '<div class="actions"><button class="icon-btn" title="Edit" onclick="open'+type+'(\''+id+'\')">✎</button>'+(type==='Student'?'<button class="icon-btn" title="Buat PIN baru" onclick="resetPin(\''+id+'\')">⌁</button>':'')+'<button class="icon-btn" title="Ubah status" onclick="toggle'+type+'(\''+id+'\')">◉</button></div>'}
    function openStudent(id=''){const s=students.find(x=>x.id===id)||{name:'',classId:'',pin:'',active:true};dialog.innerHTML='<div class="dialog-head"><h2>'+(id?'Edit siswa':'Tambah siswa')+'</h2><p>Lengkapi nama, kelas, dan akses jurnal siswa.</p></div><form onsubmit="submitStudent(event,\''+id+'\')"><div class="dialog-body"><div class="field"><label>Nama lengkap</label><input required name="name" class="control" value="'+esc(s.name)+'"></div><div class="field"><label>Kelas</label><select required name="classId" class="control"><option value="">Pilih kelas</option>'+classes.filter(c=>c.active||c.id===s.classId).map(c=>'<option value="'+c.id+'" '+(c.id===s.classId?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>PIN 6 digit</label><input required name="pin" class="control" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" value="'+esc(s.pin)+'"></div><label class="switch-row"><span><strong>Akun aktif</strong><small>Jika aktif, siswa dapat masuk dan mengisi jurnal.</small></span><input name="active" type="checkbox" '+(s.active?'checked':'')+'></label></div><div class="dialog-foot"><button type="button" class="btn" onclick="closeDialog()">Batal</button><button class="btn primary">Simpan siswa</button></div></form>';backdrop.classList.remove('hidden')}
    function openClass(id=''){const c=classes.find(x=>x.id===id)||{name:'',active:true};dialog.innerHTML='<div class="dialog-head"><h2>'+(id?'Edit kelas':'Tambah kelas')+'</h2><p>Atur nama dan ketersediaan kelas.</p></div><form onsubmit="submitClass(event,\''+id+'\')"><div class="dialog-body"><div class="field"><label>Nama kelas</label><input required name="name" class="control" placeholder="Contoh: 1A" value="'+esc(c.name)+'"></div><label class="switch-row"><span><strong>Kelas aktif</strong><small>Dapat dipilih saat menambah siswa.</small></span><input name="active" type="checkbox" '+(c.active?'checked':'')+'></label></div><div class="dialog-foot"><button type="button" class="btn" onclick="closeDialog()">Batal</button><button class="btn primary">Simpan kelas</button></div></form>';backdrop.classList.remove('hidden')}
    let importedRows=[];
    function openImport(){importedRows=[];dialog.innerHTML='<div class="dialog-head"><h2>Import & timpa siswa</h2><p>Daftar lama akan diganti setelah Anda menekan tombol konfirmasi.</p></div><div class="dialog-body"><div class="import-note"><strong>Excel, CSV, atau TSV</strong><br>Kolom wajib: <b>nama siswa</b> dan <b>kelas</b>. Data diperiksa dan ditampilkan sebelum ditimpa.</div><a class="btn" href="assets/Template-Import-Siswa-Jurnal7KAIH.xlsx" download>↓ Download template Excel</a><div class="field" style="margin-top:16px"><label>Pilih file daftar siswa</label><input id="studentFile" class="control" type="file" accept=".xlsx,.xls,.csv,.tsv,.txt" onchange="readStudentFile(this.files[0])"></div><div id="importResult"></div></div><div class="dialog-foot"><button type="button" class="btn" onclick="closeDialog()">Batal</button><button id="confirmImport" type="button" class="btn primary" disabled onclick="confirmImport()">Timpa daftar siswa</button></div>';backdrop.classList.remove('hidden')}
    function parseDelimited(text){const delimiter=text.split(/\r?\n/,1)[0].includes('\t')?'\t':text.split(/\r?\n/,1)[0].includes(';')?';':',';return text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(line=>line.trim()).map(line=>{const cells=[];let value='',quoted=false;for(let i=0;i<line.length;i++){const char=line[i];if(char==='"'&&line[i+1]==='"'){value+='"';i++}else if(char==='"')quoted=!quoted;else if(char===delimiter&&!quoted){cells.push(value.trim());value=''}else value+=char}cells.push(value.trim());return cells})}
    function readStudentFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{const result=document.getElementById('importResult');try{const excel=/\.xlsx?$/i.test(file.name),rows=excel?XLSX.utils.sheet_to_json(XLSX.read(reader.result,{type:'array'}).Sheets[XLSX.read(reader.result,{type:'array'}).SheetNames[0]],{header:1,raw:false,defval:''}):parseDelimited(new TextDecoder().decode(reader.result));if(rows.length<2)throw new Error('File belum memiliki data siswa.');const normalize=s=>String(s).toLowerCase().trim().replace(/[_-]+/g,' ').replace(/\s+/g,' '),headers=rows[0].map(normalize),nameIndex=headers.findIndex(h=>h==='nama siswa'||h==='nama'),classIndex=headers.findIndex(h=>h==='kelas');if(nameIndex<0||classIndex<0)throw new Error('Kolom “nama siswa” dan “kelas” tidak ditemukan pada baris pertama.');const errors=[],seen=new Set(),valid=[];rows.slice(1).forEach((row,index)=>{const name=String(row[nameIndex]||'').trim(),className=String(row[classIndex]||'').trim().toUpperCase(),classItem=classes.find(c=>c.name.toUpperCase()===className);if(!name&&!className)return;if(!name)errors.push('Baris '+(index+2)+': nama siswa kosong.');else if(!classItem)errors.push('Baris '+(index+2)+': kelas “'+className+'” tidak tersedia.');else if(seen.has(name.toLowerCase()+'|'+className))errors.push('Baris '+(index+2)+': siswa duplikat dalam kelas yang sama.');else{seen.add(name.toLowerCase()+'|'+className);valid.push({name,classId:classItem.id})}});if(errors.length){importedRows=[];result.innerHTML='<div class="import-errors"><strong>Import belum dapat dilanjutkan:</strong><br>'+errors.slice(0,20).map(esc).join('<br>')+(errors.length>20?'<br>… dan '+(errors.length-20)+' kesalahan lainnya.':'')+'</div>'}else{importedRows=valid;const preview=valid.slice(0,8).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(klass(x.classId))+'</td></tr>').join('');result.innerHTML='<div class="import-note"><strong>'+valid.length+' siswa siap diimpor.</strong><br>Preview '+Math.min(8,valid.length)+' data pertama:</div><div class="table-wrap"><table class="table" style="min-width:0"><thead><tr><th>Nama siswa</th><th>Kelas</th></tr></thead><tbody>'+preview+'</tbody></table></div>'}document.getElementById('confirmImport').disabled=!importedRows.length}catch(error){importedRows=[];result.innerHTML='<div class="import-errors">'+esc(error.message)+'</div>';document.getElementById('confirmImport').disabled=true}};reader.readAsArrayBuffer(file)}
    function securePin(){const value=new Uint32Array(1);crypto.getRandomValues(value);return String(100000+(value[0]%900000))}
    function confirmImport(){if(!importedRows.length||!confirm('Timpa seluruh daftar siswa dengan '+importedRows.length+' data baru?'))return;const used=new Set();students=importedRows.map((row,index)=>{let pin=securePin();while(used.has(pin))pin=securePin();used.add(pin);return{id:'s'+Date.now()+'-'+index,name:row.name,classId:row.classId,pin,active:true}});save();closeDialog();render()}
    function submitStudent(e,id){e.preventDefault();const f=new FormData(e.target),data={id:id||'s'+Date.now(),name:f.get('name').trim(),classId:f.get('classId'),pin:f.get('pin'),active:f.get('active')==='on'},i=students.findIndex(s=>s.id===id);i<0?students.push(data):students[i]=data;save();closeDialog();render()}
    function submitClass(e,id){e.preventDefault();const f=new FormData(e.target),data={id:id||'c'+Date.now(),name:f.get('name').trim(),active:f.get('active')==='on'},i=classes.findIndex(c=>c.id===id);i<0?classes.push(data):classes[i]=data;save();closeDialog();render()}
    function resetPin(id){const s=students.find(x=>x.id===id);if(!s||!confirm('Buat PIN baru untuk '+s.name+'?'))return;let pin=securePin();while(students.some(x=>x.id!==id&&x.pin===pin))pin=securePin();s.pin=pin;save();render();alert('PIN baru '+s.name+': '+pin)}
    let syncPlan=null;
    function header(title,desc,button){const filters=view==='students'?'<select class="filter" onchange="classFilter=this.value;render()"><option value="">Semua kelas</option>'+classes.map(c=>'<option value="'+c.id+'" '+(classFilter===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><select class="filter" onchange="statusFilter=this.value;render()"><option value="">Semua status</option><option value="active" '+(statusFilter==='active'?'selected':'')+'>Aktif</option><option value="inactive" '+(statusFilter==='inactive'?'selected':'')+'>Nonaktif</option></select>':'';return '<div class="panel-head"><div><h2>'+title+'</h2><p>'+desc+'</p></div><div class="tools"><input class="search" value="'+esc(query)+'" oninput="query=this.value;render()" placeholder="Cari '+(view==='students'?'nama atau kelas':'kelas')+'">'+filters+(view==='students'?'<button class="btn" onclick="openImport()">⟳ Sinkronisasi</button>':'')+'<button class="btn primary" onclick="'+button+'">＋ Tambah</button></div></div>'}
    function downloadSyncTemplate(){const rows=students.length?students.map(s=>({'id sistem':s.id,'nama siswa':s.name,'kelas':klass(s.classId)})):[{'id sistem':'','nama siswa':'Contoh Nama Siswa','kelas':'1A'}],sheet=XLSX.utils.json_to_sheet(rows,{header:['id sistem','nama siswa','kelas']});sheet['!cols']=[{hidden:true},{wch:36},{wch:12}];const book=XLSX.utils.book_new();XLSX.utils.book_append_sheet(book,sheet,'Daftar Siswa');XLSX.writeFile(book,'Sinkronisasi-Siswa-Jurnal7KAIH.xlsx')}
    function openImport(){importedRows=[];syncPlan=null;dialog.innerHTML='<div class="dialog-head"><h2>Sinkronisasi siswa</h2><p>PIN, ID, dan riwayat siswa yang sudah ada akan dipertahankan.</p></div><div class="dialog-body"><div class="import-note"><strong>Cara paling aman</strong><br>Download data terbaru, ubah kolom <b>nama siswa</b> atau <b>kelas</b>, tambahkan siswa baru pada baris berikutnya, lalu impor kembali. Jangan mengubah kolom ID Sistem.</div><button type="button" class="btn" onclick="downloadSyncTemplate()">↓ Download data & template Excel</button><div class="field" style="margin-top:16px"><label>Pilih file sinkronisasi</label><input id="studentFile" class="control" type="file" accept=".xlsx,.xls,.csv,.tsv,.txt" onchange="readStudentFile(this.files[0])"></div><div id="importResult"></div></div><div class="dialog-foot"><button type="button" class="btn" onclick="closeDialog()">Batal</button><button id="confirmImport" type="button" class="btn primary" disabled onclick="confirmImport()">Terapkan sinkronisasi</button></div>';backdrop.classList.remove('hidden')}
    function readStudentFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{const result=document.getElementById('importResult');try{let rows;if(/\.xlsx?$/i.test(file.name)){const book=XLSX.read(reader.result,{type:'array'});rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,raw:false,defval:''})}else rows=parseDelimited(new TextDecoder().decode(reader.result));if(rows.length<2)throw new Error('File belum memiliki data siswa.');const norm=s=>String(s).toLowerCase().trim().replace(/[_-]+/g,' ').replace(/\s+/g,' '),headers=rows[0].map(norm),idIndex=headers.findIndex(h=>h==='id sistem'||h==='id'),nameIndex=headers.findIndex(h=>h==='nama siswa'||h==='nama'),classIndex=headers.findIndex(h=>h==='kelas');if(nameIndex<0||classIndex<0)throw new Error('Kolom “nama siswa” dan “kelas” tidak ditemukan.');const errors=[],incoming=[],seenIds=new Set(),seenNames=new Set();rows.slice(1).forEach((row,index)=>{const systemId=idIndex<0?'':String(row[idIndex]||'').trim(),name=String(row[nameIndex]||'').trim(),className=String(row[classIndex]||'').trim().toUpperCase(),classItem=classes.find(c=>c.name.toUpperCase()===className);if(!name&&!className&&!systemId)return;if(!name)errors.push('Baris '+(index+2)+': nama siswa kosong.');else if(!classItem)errors.push('Baris '+(index+2)+': kelas “'+className+'” tidak tersedia.');else if(systemId&&seenIds.has(systemId))errors.push('Baris '+(index+2)+': ID Sistem duplikat.');else{if(systemId&&!students.some(s=>s.id===systemId))errors.push('Baris '+(index+2)+': ID Sistem tidak dikenali.');if(systemId)seenIds.add(systemId);const key=norm(name)+'|'+className;if(!systemId&&seenNames.has(key))errors.push('Baris '+(index+2)+': siswa duplikat dalam kelas yang sama.');seenNames.add(key);incoming.push({systemId,name,classId:classItem.id})}});const used=new Set(),updates=[],additions=[],unchanged=[];incoming.forEach(row=>{let match=row.systemId?students.find(s=>s.id===row.systemId):null;if(!match){const byName=students.filter(s=>norm(s.name)===norm(row.name)&&!used.has(s.id));if(byName.length===1)match=byName[0];else if(byName.length>1)errors.push('Nama “'+row.name+'” lebih dari satu. Gunakan file hasil download yang memiliki ID Sistem.')}if(match){used.add(match.id);const changed=match.name!==row.name||match.classId!==row.classId||!match.active;(changed?updates:unchanged).push({old:match,row})}else additions.push(row)});const deactivations=students.filter(s=>!used.has(s.id)&&s.active);if(errors.length){syncPlan=null;result.innerHTML='<div class="import-errors"><strong>Sinkronisasi belum dapat dilanjutkan:</strong><br>'+errors.slice(0,20).map(esc).join('<br>')+'</div>'}else{syncPlan={updates,additions,unchanged,deactivations};result.innerHTML='<div class="import-note"><strong>Rencana sinkronisasi</strong><br>＋ '+additions.length+' siswa baru<br>↻ '+updates.length+' siswa diperbarui/diaktifkan<br>✓ '+unchanged.length+' siswa tetap<br>○ '+deactivations.length+' siswa dinonaktifkan<br><br>Tidak ada siswa atau riwayat yang dihapus.</div>'}document.getElementById('confirmImport').disabled=!syncPlan}catch(error){syncPlan=null;result.innerHTML='<div class="import-errors">'+esc(error.message)+'</div>';document.getElementById('confirmImport').disabled=true}};reader.readAsArrayBuffer(file)}
    function confirmImport(){if(!syncPlan||!confirm('Terapkan rencana sinkronisasi ini? Tidak ada riwayat yang akan dihapus.'))return;syncPlan.updates.forEach(({old,row})=>{old.name=row.name;old.classId=row.classId;old.active=true});syncPlan.additions.forEach((row,index)=>{let pin=securePin();while(students.some(s=>s.pin===pin))pin=securePin();students.push({id:'s'+Date.now()+'-'+index,name:row.name,classId:row.classId,pin,active:true})});syncPlan.deactivations.forEach(s=>s.active=false);save();closeDialog();render()}
    function toggleStudent(id){const s=students.find(x=>x.id===id);s.active=!s.active;save();render()}function toggleClass(id){const c=classes.find(x=>x.id===id);c.active=!c.active;save();render()}function closeDialog(){backdrop.classList.add('hidden')}render();
  </script>
