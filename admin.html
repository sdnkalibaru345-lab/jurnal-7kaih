<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#064e3b">
  <title>Panel Admin | Jurnal 7 KAIH</title>
  <style>
    @font-face{font-family:Inter;src:url('assets/InterVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
    :root{--green:#064e3b;--green2:#047857;--ink:#172b26;--muted:#66756f;--line:#dbe8e2;--bg:#f3f7f5;--white:#fff;font-family:Inter,Arial,sans-serif}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);background:var(--bg);min-width:320px}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.hidden{display:none!important}
    .shell{min-height:100dvh;display:grid;grid-template-columns:245px 1fr}.sidebar{position:sticky;top:0;height:100dvh;background:var(--green);color:#fff;padding:26px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 7px 25px}.brand img{width:45px;height:45px;object-fit:contain}.brand small{display:block;color:#a7f3d0;font-size:10px;font-weight:850;letter-spacing:.12em}.brand strong{display:block;margin-top:3px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#d7f6e9;text-align:left;border-radius:13px;padding:13px 14px;font-weight:700}.nav button.active{background:#ffffff18;color:#fff}.nav button span{display:inline-block;width:25px}.sidebar-foot{margin-top:auto;border-top:1px solid #ffffff20;padding:18px 7px 0}.sidebar-foot small{display:block;color:#a7f3d0}.sidebar-foot strong{font-size:13px}
    main{min-width:0}.topbar{height:76px;background:#ffffffdd;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.topbar h1{font-size:20px;margin:0}.topbar p{font-size:12px;color:var(--muted);margin:3px 0 0}.prototype{font-size:11px;font-weight:850;color:#92400e;background:#fef3c7;border-radius:99px;padding:7px 10px}.content{width:min(1180px,calc(100% - 48px));margin:28px auto 60px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 4px 15px #12382d08}.stat small{color:var(--muted);font-weight:650}.stat strong{display:block;font-size:28px;margin-top:7px}.panel{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 5px 18px #12382d09}.panel-head{padding:20px;display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line)}.panel-head h2{font-size:20px;margin:0}.panel-head p{font-size:13px;color:var(--muted);margin:5px 0 0}.tools{display:flex;gap:9px;align-items:center}.search{height:44px;width:260px;border:1px solid var(--line);background:#f8faf9;border-radius:12px;padding:0 13px;font-size:14px}.btn{min-height:44px;border-radius:12px;padding:10px 15px;font-weight:800;border:1px solid var(--line);background:#fff;color:var(--ink)}.btn.primary{border-color:var(--green2);background:var(--green2);color:#fff}.btn.danger{color:#b91c1c}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th{text-align:left;padding:12px 18px;background:#f8faf9;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.table td{padding:15px 18px;border-top:1px solid #edf3f0;font-size:14px}.name{font-weight:750}.sub{display:block;color:var(--muted);font-size:11px;margin-top:3px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:800}.badge.on{background:#dcfce7;color:#166534}.badge.off{background:#f1f5f9;color:#64748b}.actions{display:flex;gap:7px}.icon-btn{min-width:40px;min-height:40px;border:1px solid var(--line);background:#fff;border-radius:10px}.cards-mobile{display:none}.empty{padding:42px 20px;text-align:center;color:var(--muted)}
    .backdrop{position:fixed;inset:0;z-index:20;background:#071c16aa;display:grid;place-items:center;padding:18px}.dialog{width:min(520px,100%);max-height:92dvh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 30px 80px #0004}.dialog-head{padding:22px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:22px}.dialog-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.dialog-body{padding:20px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.control{width:100%;height:48px;border:1px solid #c9d9d2;border-radius:12px;background:#fbfdfc;padding:0 13px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.switch-row{display:flex;justify-content:space-between;gap:15px;align-items:center;background:#f0f7f4;padding:13px;border-radius:13px}.switch-row small{display:block;color:var(--muted);margin-top:3px}.dialog-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:flex-end;gap:9px}
    .mobile-nav{display:none}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.topbar{height:68px;padding:0 22px}.content{width:min(100% - 32px,760px)}.stats{grid-template-columns:repeat(3,1fr)}.mobile-nav{position:fixed;display:grid;grid-template-columns:1fr 1fr;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));z-index:10;background:#063c2df2;border-radius:17px;padding:6px;box-shadow:0 15px 40px #0003}.mobile-nav button{min-height:48px;border:0;background:transparent;color:#c7f9e9;border-radius:12px;font-weight:750}.mobile-nav button.active{background:#fff;color:var(--green)}}
    @media(max-width:640px){.topbar{padding:0 14px}.topbar h1{font-size:17px}.topbar p{display:none}.prototype{font-size:9px;padding:6px 8px}.content{width:calc(100% - 20px);margin:14px auto 90px}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px;border-radius:16px}.stat:last-child{grid-column:1/-1}.stat strong{font-size:23px}.panel{border-radius:18px;margin-top:13px}.panel-head{padding:16px;align-items:stretch;flex-direction:column}.panel-head h2{font-size:18px}.tools{display:grid;grid-template-columns:1fr auto}.search{width:100%;font-size:16px}.table-wrap{display:none}.cards-mobile{display:grid;padding:10px;gap:9px}.record{border:1px solid var(--line);border-radius:15px;padding:14px}.record-top{display:flex;justify-content:space-between;gap:12px}.record h3{font-size:15px;margin:0}.record p{font-size:12px;color:var(--muted);margin:5px 0 12px}.record-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.dialog{align-self:end;width:100%;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom)}.backdrop{padding:0}.dialog-head{padding:19px 17px}.dialog-body{padding:17px}.dialog-foot{display:grid;grid-template-columns:.8fr 1.2fr;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}.row{grid-template-columns:1fr}}
    .brand{gap:12px}.brand-logo{width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 20px #00271d55;flex:0 0 auto}.brand-logo img{width:47px;height:47px}.brand strong{line-height:1.3}.import-note{background:#eff8f4;border:1px solid #cce6da;border-radius:14px;padding:13px;font-size:12px;line-height:1.55;color:#315c4f;margin-bottom:16px}.import-errors{max-height:180px;overflow:auto;background:#fff1f2;color:#9f1239;border-radius:12px;padding:12px;font-size:12px;line-height:1.55;margin-top:12px}
    @media(max-width:640px){.tools{grid-template-columns:1fr 1fr}.tools .search{grid-column:1/-1}.tools .btn{padding-inline:8px;font-size:12px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar"><div class="brand"><span class="brand-logo"><img src="assets/logo-kb3.png" alt="Logo SDN Kalibaru 3"></span><div><small>SDN KALIBARU 3</small><strong>Admin Jurnal 7 KAIH</strong></div></div><nav class="nav"><button data-view="students" class="active" onclick="setView('students')"><span>👥</span> Data Siswa</button><button data-view="classes" onclick="setView('classes')"><span>🏫</span> Data Kelas</button></nav><div class="sidebar-foot"><small>Masuk sebagai</small><strong>Administrator Sekolah</strong></div></aside>
    <main><header class="topbar"><div><h1 id="pageTitle">Data Siswa</h1><p>Kelola akun siswa Jurnal 7 KAIH</p></div><span class="prototype">PROTOTIPE LOKAL</span></header><div class="content"><section class="stats"><div class="stat"><small>Total siswa</small><strong id="studentCount">0</strong></div><div class="stat"><small>Kelas aktif</small><strong id="classCount">0</strong></div><div class="stat"><small>Akun aktif</small><strong id="activeCount">0</strong></div></section><section id="panel" class="panel"></section></div></main>
  </div>
  <nav class="mobile-nav"><button data-view="students" class="active" onclick="setView('students')">👥 Siswa</button><button data-view="classes" onclick="setView('classes')">🏫 Kelas</button></nav>
  <div id="backdrop" class="backdrop hidden" onclick="if(event.target===this)closeDialog()"><div id="dialog" class="dialog"></div></div>
  <script>
    const seedClasses=Array.from({length:6},(_,grade)=>Array.from({length:4},(_,room)=>({id:'c'+(grade+1)+String.fromCharCode(65+room),name:String(grade+1)+String.fromCharCode(65+room),active:true}))).flat();
    const seedStudents=[];
    let classes=JSON.parse(localStorage.getItem('j7-admin-v2-classes')||'null')||seedClasses,students=JSON.parse(localStorage.getItem('j7-admin-v2-students')||'null')||seedStudents,view='students',query='';
    const panel=document.getElementById('panel'),dialog=document.getElementById('dialog'),backdrop=document.getElementById('backdrop'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){localStorage.setItem('j7-admin-v2-classes',JSON.stringify(classes));localStorage.setItem('j7-admin-v2-students',JSON.stringify(students))}
    function klass(id){return classes.find(c=>c.id===id)?.name||'Tanpa kelas'}
    function stats(){studentCount.textContent=students.length;classCount.textContent=classes.filter(c=>c.active).length;activeCount.textContent=students.filter(s=>s.active).length}
    function setView(next){view=next;query='';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));pageTitle.textContent=view==='students'?'Data Siswa':'Data Kelas';render()}
    function render(){stats();view==='students'?renderStudents():renderClasses()}
    function header(title,desc,button){return '<div class="panel-head"><div><h2>'+title+'</h2><p>'+desc+'</p></div><div class="tools"><input class="search" value="'+esc(query)+'" oninput="query=this.value;render()" placeholder="Cari '+(view==='students'?'nama atau kelas':'kelas')+'">'+(view==='students'?'<button class="btn" onclick="openImport()">⇧ Import & Timpa</button>':'')+'<button class="btn primary" onclick="'+button+'">＋ Tambah</button></div></div>'}
    function renderStudents(){const rows=students.filter(s=>(s.name+' '+klass(s.classId)).toLowerCase().includes(query.toLowerCase()));panel.innerHTML=header('Daftar Siswa','Tambah dan perbarui akun siswa.','openStudent()')+(rows.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Nama siswa</th><th>Kelas</th><th>PIN</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+rows.map(s=>'<tr><td><span class="name">'+esc(s.name)+'</span></td><td>'+esc(klass(s.classId))+'</td><td>••••'+esc(s.pin.slice(-2))+'</td><td>'+badge(s.active)+'</td><td>'+actions('Student',s.id)+'</td></tr>').join('')+'</tbody></table></div><div class="cards-mobile">'+rows.map(s=>'<article class="record"><div class="record-top"><div><h3>'+esc(s.name)+'</h3><p>Kelas '+esc(klass(s.classId))+'</p></div>'+badge(s.active)+'</div><div class="record-foot"><small>PIN ••••'+esc(s.pin.slice(-2))+'</small>'+actions('Student',s.id)+'</div></article>').join('')+'</div>':'<div class="empty">Belum ada siswa yang cocok.</div>')}
    function renderClasses(){const rows=classes.filter(c=>c.name.toLowerCase().includes(query.toLowerCase()));panel.innerHTML=header('Daftar Kelas','Kelola kelas yang tersedia pada jurnal.','openClass()')+(rows.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Kelas</th><th>Jumlah siswa</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+rows.map(c=>'<tr><td class="name">Kelas '+esc(c.name)+'</td><td>'+students.filter(s=>s.classId===c.id).length+'</td><td>'+badge(c.active)+'</td><td>'+actions('Class',c.id)+'</td></tr>').join('')+'</tbody></table></div><div class="cards-mobile">'+rows.map(c=>'<article class="record"><div class="record-top"><div><h3>Kelas '+esc(c.name)+'</h3><p>'+students.filter(s=>s.classId===c.id).length+' siswa</p></div>'+badge(c.active)+'</div><div class="record-foot"><span></span>'+actions('Class',c.id)+'</div></article>').join('')+'</div>':'<div class="empty">Belum ada kelas yang cocok.</div>')}
    function badge(on){return '<span class="badge '+(on?'on':'off')+'">'+(on?'● Aktif':'● Nonaktif')+'</span>'}function actions(type,id){return '<div class="actions"><button class="icon-btn" title="Edit" onclick="open'+type+'(\''+id+'\')">✎</button><button class="icon-btn" title="Ubah status" onclick="toggle'+type+'(\''+id+'\')">◉</button></div>'}
    function openStudent(id=''){const s=students.find(x=>x.id===id)||{name:'',classId:'',pin:'',active:true};dialog.innerHTML='<div class="dialog-head"><h2>'+(id?'Edit siswa':'Tambah siswa')+'</h2><p>Lengkapi nama, kelas, dan akses jurnal siswa.</p></div><form onsubmit="submitStudent(event,\''+id+'\')"><div class="dialog-body"><div class="field"><label>Nama lengkap</label><input required name="name" class="control" value="'+esc(s.name)+'"></div><div class="field"><label>Kelas</label><select required name="classId" class="control"><option value="">Pilih kelas</option>'+classes.filter(c=>c.active||c.id===s.classId).map(c=>'<option value="'+c.id+'" '+(c.id===s.classId?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>PIN 6 digit</label><input required name="pin" class="control" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" value="'+esc(s.pin)+'"></div><label class="switch-row"><span><strong>Akun aktif</strong><small>Jika aktif, siswa dapat masuk dan mengisi jurnal.</small></span><input name="active" type="checkbox" '+(s.active?'checked':'')+'></label></div><div class="dialog-foot"><button type="button" class="btn" onclick="closeDialog()">Batal</button><button class="btn primary">Simpan siswa</button></div></form>';backdrop.classList.remove('hidden')}
    function openClass(id=''){const c=classes.find(x=>x.id===id)||{name:'',active:true};dialog.innerHTML='<div class="dialog-head"><h2>'+(id?'Edit kelas':'Tambah kelas')+'</h2><p>Atur nama dan ketersediaan kelas.</p></div><form onsubmit="submitClass(event,\''+id+'\')"><div class="dialog-body"><div class="field"><label>Nama kelas</label><input required name="name" class="control" placeholder="Contoh: 1A" value="'+esc(c.name)+'"></div><label class="switch-row"><span><strong>Kelas aktif</strong><small>Dapat dipilih saat menambah siswa.</small></span><input name="active" type="checkbox" '+(c.active?'checked':'')+'></label></div><div class="dialog-foot"><button type="button" class="btn" onclick="closeDialog()">Batal</button><button class="btn primary">Simpan kelas</button></div></form>';backdrop.classList.remove('hidden')}
    let importedRows=[];
    function openImport(){importedRows=[];dialog.innerHTML='<div class="dialog-head"><h2>Import & timpa siswa</h2><p>Daftar lama akan diganti setelah Anda menekan tombol konfirmasi.</p></div><div class="dialog-body"><div class="import-note"><strong>Format file CSV atau TSV</strong><br>Baris pertama wajib memiliki kolom <b>nama siswa</b> dan <b>kelas</b>. Contoh kelas: 1A, 2B, atau 6D. PIN enam digit dibuat otomatis.</div><div class="field"><label>Pilih file daftar siswa</label><input id="studentFile" class="control" type="file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values" onchange="readStudentFile(this.files[0])"></div><div id="importResult"></div></div><div class="dialog-foot"><button type="button" class="btn" onclick="closeDialog()">Batal</button><button id="confirmImport" type="button" class="btn primary" disabled onclick="confirmImport()">Timpa daftar siswa</button></div>';backdrop.classList.remove('hidden')}
    function parseDelimited(text){const delimiter=text.split(/\r?\n/,1)[0].includes('\t')?'\t':text.split(/\r?\n/,1)[0].includes(';')?';':',';return text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(line=>line.trim()).map(line=>{const cells=[];let value='',quoted=false;for(let i=0;i<line.length;i++){const char=line[i];if(char==='"'&&line[i+1]==='"'){value+='"';i++}else if(char==='"')quoted=!quoted;else if(char===delimiter&&!quoted){cells.push(value.trim());value=''}else value+=char}cells.push(value.trim());return cells})}
    function readStudentFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{const result=document.getElementById('importResult');try{const rows=parseDelimited(reader.result);if(rows.length<2)throw new Error('File belum memiliki data siswa.');const normalize=s=>s.toLowerCase().trim().replace(/[_-]+/g,' ').replace(/\s+/g,' '),headers=rows[0].map(normalize),nameIndex=headers.findIndex(h=>h==='nama siswa'||h==='nama'),classIndex=headers.findIndex(h=>h==='kelas');if(nameIndex<0||classIndex<0)throw new Error('Kolom “nama siswa” dan “kelas” tidak ditemukan.');const errors=[],seen=new Set(),valid=[];rows.slice(1).forEach((row,index)=>{const name=(row[nameIndex]||'').trim(),className=(row[classIndex]||'').trim().toUpperCase(),classItem=classes.find(c=>c.name.toUpperCase()===className);if(!name)errors.push('Baris '+(index+2)+': nama siswa kosong.');else if(!classItem)errors.push('Baris '+(index+2)+': kelas “'+className+'” tidak tersedia.');else if(seen.has(name.toLowerCase()+'|'+className))errors.push('Baris '+(index+2)+': siswa duplikat.');else{seen.add(name.toLowerCase()+'|'+className);valid.push({name,classId:classItem.id})}});if(errors.length){importedRows=[];result.innerHTML='<div class="import-errors"><strong>Import belum dapat dilanjutkan:</strong><br>'+errors.slice(0,20).map(esc).join('<br>')+(errors.length>20?'<br>… dan '+(errors.length-20)+' kesalahan lainnya.':'')+'</div>'}else{importedRows=valid;result.innerHTML='<div class="import-note"><strong>'+valid.length+' siswa siap diimpor.</strong><br>Periksa jumlahnya, lalu tekan “Timpa daftar siswa”.</div>'}document.getElementById('confirmImport').disabled=!importedRows.length}catch(error){importedRows=[];result.innerHTML='<div class="import-errors">'+esc(error.message)+'</div>';document.getElementById('confirmImport').disabled=true}};reader.readAsText(file)}
    function confirmImport(){if(!importedRows.length)return;students=importedRows.map((row,index)=>({id:'s'+Date.now()+'-'+index,name:row.name,classId:row.classId,pin:String(100001+index).padStart(6,'0'),active:true}));save();closeDialog();render()}
    function submitStudent(e,id){e.preventDefault();const f=new FormData(e.target),data={id:id||'s'+Date.now(),name:f.get('name').trim(),classId:f.get('classId'),pin:f.get('pin'),active:f.get('active')==='on'},i=students.findIndex(s=>s.id===id);i<0?students.push(data):students[i]=data;save();closeDialog();render()}
    function submitClass(e,id){e.preventDefault();const f=new FormData(e.target),data={id:id||'c'+Date.now(),name:f.get('name').trim(),active:f.get('active')==='on'},i=classes.findIndex(c=>c.id===id);i<0?classes.push(data):classes[i]=data;save();closeDialog();render()}
    function toggleStudent(id){const s=students.find(x=>x.id===id);s.active=!s.active;save();render()}function toggleClass(id){const c=classes.find(x=>x.id===id);c.active=!c.active;save();render()}function closeDialog(){backdrop.classList.add('hidden')}render();
  </script>
</body>
</html>
